<section class="mx-auto max-w-5xl px-4 py-12">
 <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">{{contact.h1}}</h1>
 <p class="mt-3 max-w-2xl text-muted">{{contact.intro}}</p>

 <div class="mt-8 grid gap-4 md:grid-cols-2 max-w-3xl">
  <div class="card">
   <h2 class="font-semibold">{{contact.githubTitle}}</h2>
   <p class="text-sm text-muted mt-2">{{contact.githubDesc}}</p>
   <p class="mt-3 text-sm break-all"><a class="underline text-primary" href="{{@repo}}/issues" target="_blank" rel="noopener">{{@repoLabel}}/issues</a></p>
   <p class="mt-1 text-sm break-all"><a class="underline text-primary" href="{{@github}}" target="_blank" rel="noopener">{{@github}}</a></p>
  </div>
  <div class="card">
   <h2 class="font-semibold">{{contact.emailTitle}}</h2>
   <p class="text-sm text-muted mt-2">{{contact.emailDesc}}</p>
   <p class="mt-3 text-sm break-all"><a class="underline text-primary" href="mailto:{{@email}}">{{@email}}</a></p>
  </div>
 </div>
 <p class="mt-6 max-w-2xl text-sm text-muted">{{contact.tip}}</p>
</section>
