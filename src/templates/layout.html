<!DOCTYPE html>
<html lang="{{@htmlLang}}">
<head>
<meta charset="utf-8">

<link rel="canonical" href="{{@canonical}}">
{{@hreflangLinks}}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%236c8cff'/%3E%3Cpath d='M45 16H19l15 16-15 16h26' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

</svg>

{{> header}}

<main>
{{@content}}
</main>

{{> footer}}

<script type="module" src="/src/main.js"></script>

</html>
